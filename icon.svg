<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PumaBass">
<title>PumaBass</title>
<!-- The premise, not the category: the notes coming at you. Four strings in
     Rocksmith's colours run away into the distance, the cyan line is "now",
     and the notes ride in on their strings: the near one cyan, the tribe's
     live thing, about to land; one amber further back; a last one far off.
     Paths only, no font.

     favicon-16x16.png, favicon-32x32.png, favicon.ico, apple-touch-icon.png
     and og.png are all rendered from this file; re-render them if it changes
     (tools/render-icons.sh). -->
<rect width="64" height="64" rx="12" fill="#05070f"/>
<!-- A faint frame, so the tile still has an edge on the share card, whose
     ground is the same navy as the plate -->
<rect x="1.5" y="1.5" width="61" height="61" rx="10.5" fill="none" stroke="#1b2540" stroke-width="1.5"/>

<g transform="translate(32 32) scale(.84) translate(-32 -32)">
<!-- The highway's edges -->
<path d="M20 4 L3 60 M44 4 L61 60" fill="none" stroke="#47609c" stroke-width="2.5" stroke-linecap="round"/>
<!-- The strings: E, A, D, G -->
<g fill="none" stroke-width="2.4" stroke-linecap="round">
  <path d="M25 4 L14 60" stroke="#e8413c"/>
  <path d="M29.7 4 L27 60" stroke="#f2c623"/>
  <path d="M34.3 4 L37 60" stroke="#2e8ff0"/>
  <path d="M39 4 L50 60" stroke="#f5892a"/>
</g>
<!-- Now -->
<path d="M4 53 H60" stroke="#54f2ff" stroke-width="3" stroke-linecap="round"/>
<!-- The notes -->
<rect x="15" y="36" width="20" height="10" rx="2.5" fill="#54f2ff" stroke="#05070f" stroke-width="1.5"/>
<rect x="38" y="21" width="12" height="6" rx="1.6" fill="#ffb000" stroke="#05070f" stroke-width="1"/>
<rect x="20.5" y="11" width="7" height="3.6" rx="1" fill="#54f2ff" opacity=".7"/>
</g>
</svg>
