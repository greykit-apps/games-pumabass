<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PumaBass</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0f14'/%3E%3Crect x='6' y='9' width='20' height='3' fill='%23f5892a'/%3E%3Crect x='6' y='14' width='20' height='3' fill='%232e8ff0'/%3E%3Crect x='6' y='19' width='20' height='3' fill='%23f2c623'/%3E%3Crect x='6' y='24' width='20' height='3' fill='%23e8413c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Song library -->
  <section id="library" class="screen">
    <header class="lib-header">
      <h1>PumaBass</h1>
      <input id="search" type="search" placeholder="Search songs, artists, albums…" autocomplete="off">
      <div id="type-filter" class="seg">
        <button data-type="bass" class="on">Bass</button>
        <button data-type="lead">Lead</button>
        <button data-type="rhythm">Rhythm</button>
        <button data-type="all">All</button>
      </div>
      <select id="sort">
        <option value="artist">Sort: Artist</option>
        <option value="title">Sort: Title</option>
        <option value="tuning">Sort: Tuning</option>
        <option value="recent">Sort: Recently played</option>
      </select>
      <label class="check muted small" title="Charts whose song audio isn't installed. Add your own recording to the music folder to play them."><input id="show-missing" type="checkbox"> Show songs without audio</label>
      <button id="rescan" title="Look for new songs and recordings">Rescan</button>
    </header>
    <div id="count" class="muted"></div>
    <div id="song-list" role="list"></div>
  </section>

  <!-- Player -->
  <section id="player" class="screen hidden">
    <canvas id="highway"></canvas>
    <div class="top-bar">
      <button id="back" title="Back to library (Esc)">‹ Library</button>
      <div class="song-info">
        <div id="p-title"></div>
        <div id="p-sub" class="muted"></div>
      </div>
      <div id="p-tuning" class="chip"></div>
    </div>
    <div id="section-name"></div>
    <div id="loading" class="hidden">Loading…</div>

    <div class="bottom-bar">
      <div id="progress">
        <div id="sections"></div>
        <div id="loop-region" class="hidden"></div>
        <div id="playhead"></div>
      </div>
      <div class="controls">
        <button id="play" title="Play / pause (Space)">▶</button>
        <span id="time" class="muted">0:00 / 0:00</span>
        <button id="loop" title="Loop the current section (L)">⟲ Loop section</button>
        <label title="Playback speed (↑ / ↓)">Speed
          <input id="speed" type="range" min="25" max="120" step="5" value="100"><span id="speed-val">100%</span>
        </label>
        <label title="Note difficulty">Difficulty
          <input id="difficulty" type="range" min="0" max="100" step="5" value="100"><span id="diff-val">100%</span>
        </label>
        <button id="settings-btn" title="Settings">⚙</button>
      </div>
    </div>

    <div id="settings" class="panel hidden">
      <h3>Settings</h3>
      <label>Song volume <input id="volume" type="range" min="0" max="100" value="100"></label>
      <label>Note lookahead (highway length) <input id="lookahead" type="range" min="1.5" max="6" step="0.25" value="3"><span id="lookahead-val"></span></label>
      <label>Audio offset for this song <input id="offset" type="range" min="-500" max="500" step="5" value="0"><span id="offset-val"></span></label>
      <div class="nudge"><button data-nudge="-1000">−1s</button><button data-nudge="-100">−100</button><button data-nudge="-10">−10</button><button data-nudge="10">+10</button><button data-nudge="100">+100</button><button data-nudge="1000">+1s</button></div>
      <label class="check"><input id="invert" type="checkbox"> Low string on top (inverted)</label>
      <p class="muted small">Keys: Space play/pause · ← → skip 5s · ↑ ↓ speed · L loop section · [ ] set loop start/end · Home restart · Esc library. Scroll the mouse wheel to scrub while paused.</p>
      <button id="settings-close">Close</button>
    </div>
  </section>

  <audio id="audio" preload="auto"></audio>
  <script type="module" src="js/app.js"></script>
</body>
</html>
